[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pymims"
version = "0.3.0"
description = "Python tools for reading and analysing Cameca NanoSIMS .im files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "G. McMahon" }]
keywords = ["NanoSIMS", "SIMS", "Cameca", "mass spectrometry imaging", "isotopes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Core runtime deps. numpy is capped <2 until the 2.x compatibility pass
# (roadmap item) is done — matches the validated 1.26.x environment.
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
# Notebook widget UI (explore(), the slider tools)
interactive = ["ipywidgets>=8.0", "ipython>=8.0"]
# Optional: proper kneedle algorithm; falls back to an in-house impl if absent
kneedle = ["kneed>=0.8"]
# Forthcoming v0.3 Panel desktop GUI
app = ["panel>=1.4", "holoviews>=1.18", "bokeh>=3.3"]
all = ["pymims[interactive,kneedle,app]"]

[project.urls]
Homepage = "https://github.com/gregmcmahon345/PyMIMS"
Repository = "https://github.com/gregmcmahon345/PyMIMS"

[tool.setuptools]
packages = ["pymims"]
